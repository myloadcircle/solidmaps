name = "solidmaps-api"
main = "worker/src/index.ts"
compatibility_date = "2025-01-01"
account_id = "42f7ec46d661bea874dc69495840c7c3"

[[d1_databases]]
binding = "DB"
database_name = "solidmaps-db"
database_id = "67bac20d-ba2c-4dff-ac47-a707ad4f04ed"
migrations_dir = "worker/migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "00d89c7ebeb64e118749e2522419370a"

[vars]
ALLOWED_ORIGIN = "https://solidmap.app"
PMTILES_URL = "https://build.protomaps.com/20260519.pmtiles"

# --- Routing engine -----------------------------------------------------------
# Active: the OSRM public demo server (no truck restrictions, no SLA).
ROUTING_ENGINE_URL = "https://router.project-osrm.org"

# Owner's single-swap rule (2026-11-12): truck/global rollout swaps engines by
# setting ONLY VALHALLA_BASE_URL — Stage 1 hosted Valhalla, Stage 2 the
# self-hosted VPS (infra/valhalla/), Stage 3 a Cloudflare-fronted cluster.
# Standard Valhalla REST: POST /route, /optimized_route, /sources_to_targets.
# Takes priority over ROUTING_ENGINE_URL for the Valhalla adapters.
# VALHALLA_BASE_URL = "https://valhalla.solidmap.app"
# (set the proxy token secret first: npx wrangler secret put ROUTING_ENGINE_TOKEN)

# Self-hosted Valhalla — see infra/valhalla/. Flip these two ONLY once the endpoint passes
# the verification steps in infra/valhalla/README.md: an unreachable engine silently degrades
# every route to a straight line. Remember to set the matching secret first:
#   npx wrangler secret put ROUTING_ENGINE_TOKEN
# ROUTING_ENGINE_TYPE = "valhalla"
# ROUTING_ENGINE_URL  = "https://valhalla.solidmap.app"

